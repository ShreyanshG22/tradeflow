version: '3.8'

services:
  # Zerodha Authentication Service
  zerodha-auth-service:
    build:
      context: ../../services/zerodha-auth-service
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-development}
    container_name: tradeflow-zerodha-auth
    ports:
      - "3009:3009"
      - "9239:9229"  # Debug port
    volumes:
      - ../../services/zerodha-auth-service:/app
      - /app/node_modules
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3009
      POSTGRES_URL: ${POSTGRES_URL:-postgresql://tradeflow:tradeflow_dev_password@postgres:5432/tradeflow}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      ZERODHA_API_KEY: ${ZERODHA_API_KEY}
      ZERODHA_API_SECRET: ${ZERODHA_API_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tradeflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3009/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Zerodha Market Data Service
  zerodha-market-service:
    build:
      context: ../../services/zerodha-market-service
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-development}
    container_name: tradeflow-zerodha-market
    ports:
      - "3005:3005"
      - "9235:9229"  # Debug port
      - "8080:8080"   # WebSocket port
    volumes:
      - ../../services/zerodha-market-service:/app
      - /app/node_modules
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3005
      WS_PORT: 8080
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      INFLUXDB_URL: ${INFLUXDB_URL:-http://influxdb:8086}
      ZERODHA_API_KEY: ${ZERODHA_API_KEY}
      ZERODHA_API_SECRET: ${ZERODHA_API_SECRET}
    depends_on:
      redis:
        condition: service_healthy
      zerodha-auth-service:
        condition: service_healthy
    networks:
      - tradeflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Zerodha Order Service
  zerodha-order-service:
    build:
      context: ../../services/zerodha-order-service
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-development}
    container_name: tradeflow-zerodha-order
    ports:
      - "3006:3006"
      - "9236:9229"  # Debug port
    volumes:
      - ../../services/zerodha-order-service:/app
      - /app/node_modules
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3006
      POSTGRES_URL: ${POSTGRES_URL:-postgresql://tradeflow:tradeflow_dev_password@postgres:5432/tradeflow}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      ZERODHA_API_KEY: ${ZERODHA_API_KEY}
      ZERODHA_API_SECRET: ${ZERODHA_API_SECRET}
      ZERODHA_AUTH_SERVICE_URL: ${ZERODHA_AUTH_SERVICE_URL:-http://zerodha-auth-service:3009}
      ZERODHA_RISK_SERVICE_URL: ${ZERODHA_RISK_SERVICE_URL:-http://zerodha-risk-service:3008}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      zerodha-auth-service:
        condition: service_healthy
      zerodha-risk-service:
        condition: service_healthy
    networks:
      - tradeflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Zerodha Portfolio Service
  zerodha-portfolio-service:
    build:
      context: ../../services/zerodha-portfolio-service
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-development}
    container_name: tradeflow-zerodha-portfolio
    ports:
      - "3007:3007"
      - "9237:9229"  # Debug port
    volumes:
      - ../../services/zerodha-portfolio-service:/app
      - /app/node_modules
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3007
      POSTGRES_URL: ${POSTGRES_URL:-postgresql://tradeflow:tradeflow_dev_password@postgres:5432/tradeflow}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      ZERODHA_API_KEY: ${ZERODHA_API_KEY}
      ZERODHA_API_SECRET: ${ZERODHA_API_SECRET}
      ZERODHA_AUTH_SERVICE_URL: ${ZERODHA_AUTH_SERVICE_URL:-http://zerodha-auth-service:3009}
      ZERODHA_MARKET_SERVICE_URL: ${ZERODHA_MARKET_SERVICE_URL:-http://zerodha-market-service:3005}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      zerodha-auth-service:
        condition: service_healthy
      zerodha-market-service:
        condition: service_healthy
    networks:
      - tradeflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3007/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Zerodha Risk Management Service
  zerodha-risk-service:
    build:
      context: ../../services/zerodha-risk-service
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-development}
    container_name: tradeflow-zerodha-risk
    ports:
      - "3008:3008"
      - "9238:9229"  # Debug port
    volumes:
      - ../../services/zerodha-risk-service:/app
      - /app/node_modules
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3008
      POSTGRES_URL: ${POSTGRES_URL:-postgresql://tradeflow:tradeflow_dev_password@postgres:5432/tradeflow}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      ZERODHA_AUTH_SERVICE_URL: ${ZERODHA_AUTH_SERVICE_URL:-http://zerodha-auth-service:3009}
      ZERODHA_PORTFOLIO_SERVICE_URL: ${ZERODHA_PORTFOLIO_SERVICE_URL:-http://zerodha-portfolio-service:3007}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      zerodha-auth-service:
        condition: service_healthy
    networks:
      - tradeflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3008/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # InfluxDB for time-series market data
  influxdb:
    image: influxdb:2.7-alpine
    container_name: tradeflow-influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:-tradeflow_influx_password}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-tradeflow}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-market_data}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_ADMIN_TOKEN:-tradeflow_admin_token}
    networks:
      - tradeflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  influxdb_data:
  influxdb_config:

networks:
  tradeflow-network:
    external: true