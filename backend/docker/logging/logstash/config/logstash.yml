http.host: "0.0.0.0"
xpack.monitoring.enabled: false

# Pipeline settings
pipeline.workers: 2
pipeline.batch.size: 125
pipeline.batch.delay: 50

# Queue settings
queue.type: memory
queue.max_events: 0
queue.max_bytes: 1024mb

# Dead letter queue
dead_letter_queue.enable: true
dead_letter_queue.max_bytes: 1024mb

# Log settings
log.level: info
path.logs: /var/log/logstash