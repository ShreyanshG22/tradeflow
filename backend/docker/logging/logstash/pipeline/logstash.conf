input {
  beats {
    port => 5044
  }
  
  tcp {
    port => 5000
    codec => json_lines
  }
  
  http {
    port => 8080
    codec => json
  }
}

filter {
  # Parse timestamp
  if [timestamp] {
    date {
      match => [ "timestamp", "ISO8601" ]
    }
  }
  
  # Add service metadata
  if [service] {
    mutate {
      add_field => { "[@metadata][service]" => "%{service}" }
    }
  }
  
  # Parse error stack traces
  if [error][stack] {
    mutate {
      gsub => [ "[error][stack]", "\n", " | " ]
    }
  }
  
  # Categorize log levels
  if [level] {
    if [level] == "error" {
      mutate {
        add_field => { "log_category" => "error" }
        add_field => { "alert_level" => "high" }
      }
    } else if [level] == "warn" {
      mutate {
        add_field => { "log_category" => "warning" }
        add_field => { "alert_level" => "medium" }
      }
    } else {
      mutate {
        add_field => { "log_category" => "info" }
        add_field => { "alert_level" => "low" }
      }
    }
  }
  
  # Parse performance metrics
  if [type] == "performance" {
    mutate {
      add_field => { "log_category" => "performance" }
    }
    
    if [duration] {
      if [duration] > 1000 {
        mutate {
          add_field => { "performance_alert" => "slow_operation" }
        }
      }
    }
  }
  
  # Parse security events
  if [type] == "security" {
    mutate {
      add_field => { "log_category" => "security" }
    }
    
    if [severity] == "critical" or [severity] == "high" {
      mutate {
        add_field => { "security_alert" => "high_severity" }
      }
    }
  }
  
  # Parse business events
  if [type] == "business" {
    mutate {
      add_field => { "log_category" => "business" }
    }
  }
  
  # Add geo location for IP addresses
  if [ipAddress] {
    geoip {
      source => "ipAddress"
      target => "geoip"
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "tradeflow-logs-%{+YYYY.MM.dd}"
    
    # Use service-specific indices for better organization
    if [@metadata][service] {
      index => "tradeflow-%{[@metadata][service]}-%{+YYYY.MM.dd}"
    }
  }
  
  # Output errors to separate index
  if [log_category] == "error" {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "tradeflow-errors-%{+YYYY.MM.dd}"
    }
  }
  
  # Output performance metrics to separate index
  if [log_category] == "performance" {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "tradeflow-performance-%{+YYYY.MM.dd}"
    }
  }
  
  # Output security events to separate index
  if [log_category] == "security" {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "tradeflow-security-%{+YYYY.MM.dd}"
    }
  }
  
  # Debug output (remove in production)
  if [log_category] == "error" or [security_alert] or [performance_alert] {
    stdout { 
      codec => rubydebug 
    }
  }
}