# Input sources
<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<source>
  @type http
  port 9880
  bind 0.0.0.0
  body_size_limit 32m
  keepalive_timeout 10s
</source>

# Parse and enrich logs
<filter tradeflow.**>
  @type record_transformer
  <record>
    hostname "#{Socket.gethostname}"
    timestamp ${time}
    environment "#{ENV['ENVIRONMENT'] || 'development'}"
  </record>
</filter>

# Add service tags
<filter tradeflow.user-service>
  @type record_transformer
  <record>
    service_type "authentication"
    service_category "core"
  </record>
</filter>

<filter tradeflow.api-gateway>
  @type record_transformer
  <record>
    service_type "gateway"
    service_category "core"
  </record>
</filter>

<filter tradeflow.strategy-service>
  @type record_transformer
  <record>
    service_type "business_logic"
    service_category "trading"
  </record>
</filter>

<filter tradeflow.portfolio-service>
  @type record_transformer
  <record>
    service_type "business_logic"
    service_category "trading"
  </record>
</filter>

<filter tradeflow.market-data-service>
  @type record_transformer
  <record>
    service_type "data_ingestion"
    service_category "market_data"
  </record>
</filter>

# Performance monitoring
<filter tradeflow.**>
  @type grep
  <regexp>
    key type
    pattern performance
  </regexp>
</filter>

# Security event filtering
<filter tradeflow.**>
  @type grep
  <regexp>
    key type
    pattern security
  </regexp>
</filter>

# Error aggregation
<filter tradeflow.**>
  @type grep
  <regexp>
    key level
    pattern error
  </regexp>
</filter>

# Output to Elasticsearch
<match tradeflow.**>
  @type elasticsearch
  host elasticsearch
  port 9200
  logstash_format true
  logstash_prefix tradeflow
  logstash_dateformat %Y.%m.%d
  include_tag_key true
  type_name _doc
  tag_key @log_name
  flush_interval 1s
  
  <buffer>
    @type file
    path /var/log/fluentd-buffers/tradeflow.buffer
    flush_mode interval
    retry_type exponential_backoff
    flush_thread_count 2
    flush_interval 5s
    retry_forever
    retry_max_interval 30
    chunk_limit_size 2M
    queue_limit_length 8
    overflow_action block
  </buffer>
</match>

# Performance logs to separate index
<match tradeflow.performance>
  @type elasticsearch
  host elasticsearch
  port 9200
  logstash_format true
  logstash_prefix tradeflow-performance
  logstash_dateformat %Y.%m.%d
  include_tag_key true
  type_name _doc
  tag_key @log_name
  flush_interval 1s
</match>

# Security logs to separate index
<match tradeflow.security>
  @type elasticsearch
  host elasticsearch
  port 9200
  logstash_format true
  logstash_prefix tradeflow-security
  logstash_dateformat %Y.%m.%d
  include_tag_key true
  type_name _doc
  tag_key @log_name
  flush_interval 1s
</match>

# Error logs to separate index
<match tradeflow.error>
  @type elasticsearch
  host elasticsearch
  port 9200
  logstash_format true
  logstash_prefix tradeflow-errors
  logstash_dateformat %Y.%m.%d
  include_tag_key true
  type_name _doc
  tag_key @log_name
  flush_interval 1s
</match>