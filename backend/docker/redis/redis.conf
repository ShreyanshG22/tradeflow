# Redis configuration for TradeFlow - Optimized for high-performance trading

# ============================================================================
# NETWORK CONFIGURATION
# ============================================================================
bind 0.0.0.0
port 6379
timeout 0
tcp-keepalive 300
tcp-backlog 511

# ============================================================================
# GENERAL CONFIGURATION
# ============================================================================
daemonize no
supervised no
pidfile /var/run/redis_6379.pid
loglevel notice
logfile ""

# Database configuration - using multiple databases for different purposes
# DB 0: Session storage and user data
# DB 1: Market data cache
# DB 2: Strategy execution state
# DB 3: Real-time notifications and pub/sub
# DB 4: Performance metrics and analytics
databases 16

# ============================================================================
# MEMORY MANAGEMENT - Optimized for trading workloads
# ============================================================================
maxmemory 1gb
maxmemory-policy volatile-lru
maxmemory-samples 10

# Enable lazy freeing for better performance
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# ============================================================================
# PERSISTENCE - Balanced for performance and durability
# ============================================================================

# RDB Snapshotting - Less frequent for better performance
save 3600 1      # Save if at least 1 key changed in 1 hour
save 300 100     # Save if at least 100 keys changed in 5 minutes
save 60 10000    # Save if at least 10000 keys changed in 1 minute

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF - Optimized for trading data
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec  # Good balance between performance and durability
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes
aof-rewrite-incremental-fsync yes

# ============================================================================
# REPLICATION
# ============================================================================
replica-serve-stale-data yes
replica-read-only yes
repl-diskless-sync yes
repl-diskless-sync-delay 5
repl-ping-replica-period 10
repl-timeout 60
repl-disable-tcp-nodelay no
repl-backlog-size 16mb  # Larger backlog for market data
repl-backlog-ttl 3600

# ============================================================================
# SECURITY
# ============================================================================
requirepass ""
# In production, set a strong password:
# requirepass "your_secure_redis_password_here"

# ============================================================================
# CLIENT CONFIGURATION - Optimized for high-frequency trading
# ============================================================================

# Increased buffer limits for market data streaming
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 64mb 16mb 60  # Larger for real-time data

client-query-buffer-limit 1gb
proto-max-bulk-len 512mb

# ============================================================================
# PERFORMANCE TUNING
# ============================================================================

# Lua scripting timeout
lua-time-limit 5000

# Slow log configuration
slowlog-log-slower-than 1000  # Log queries slower than 1ms
slowlog-max-len 256

# Latency monitoring
latency-monitor-threshold 50  # Monitor operations taking >50μs

# Active rehashing for better performance
activerehashing yes

# Higher frequency for better responsiveness
hz 100
dynamic-hz yes

# ============================================================================
# DATA STRUCTURE OPTIMIZATION
# ============================================================================

# Hash configuration - optimized for user sessions and strategy configs
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# List configuration - optimized for trade queues
list-max-ziplist-size -2
list-compress-depth 0

# Set configuration - for symbol lists and user preferences
set-max-intset-entries 512

# Sorted set configuration - for leaderboards and time-series data
zset-max-ziplist-entries 256  # Increased for market data
zset-max-ziplist-value 128

# HyperLogLog for analytics
hll-sparse-max-bytes 3000

# Streams configuration - for real-time event streaming
stream-node-max-bytes 8192   # Larger nodes for market data streams
stream-node-max-entries 200

# ============================================================================
# KEYSPACE NOTIFICATIONS - Enable for real-time updates
# ============================================================================
# Enable keyspace notifications for expired keys and set operations
notify-keyspace-events "Ex$"

# ============================================================================
# MODULES AND EXTENSIONS
# ============================================================================
# Enable RDB and AOF incremental fsync
rdb-save-incremental-fsync yes

# ============================================================================
# TRADING-SPECIFIC CONFIGURATION
# ============================================================================

# Disable some features that might cause latency spikes in production
# (These can be re-enabled in development if needed)

# Disable automatic key expiration scanning during peak trading hours
# This can be managed programmatically
# active-expire-effort 1