# NGINX configuration for Zerodha services load balancing

upstream zerodha_auth {
    least_conn;
    server zerodha-auth-service:3009 max_fails=3 fail_timeout=30s;
}

upstream zerodha_market {
    least_conn;
    server zerodha-market-service:3005 max_fails=3 fail_timeout=30s;
}

upstream zerodha_order {
    least_conn;
    server zerodha-order-service:3006 max_fails=3 fail_timeout=30s;
}

upstream zerodha_portfolio {
    least_conn;
    server zerodha-portfolio-service:3007 max_fails=3 fail_timeout=30s;
}

upstream zerodha_risk {
    least_conn;
    server zerodha-risk-service:3008 max_fails=3 fail_timeout=30s;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=market_limit:10m rate=1000r/m;

# Main server block
server {
    listen 80;
    server_name localhost;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Zerodha Authentication Service
    location /api/zerodha/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        
        proxy_pass http://zerodha_auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout settings
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # Zerodha Market Data Service
    location /api/zerodha/market/ {
        limit_req zone=market_limit burst=50 nodelay;
        
        proxy_pass http://zerodha_market/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout settings for real-time data
        proxy_connect_timeout 3s;
        proxy_send_timeout 5s;
        proxy_read_timeout 30s;
        
        # Disable buffering for real-time data
        proxy_buffering off;
    }

    # WebSocket proxy for market data
    location /ws/market-data {
        proxy_pass http://zerodha_market;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket specific timeouts
        proxy_connect_timeout 7s;
        proxy_send_timeout 7s;
        proxy_read_timeout 300s;
        
        # Disable buffering for WebSocket
        proxy_buffering off;
    }

    # Zerodha Order Service
    location /api/zerodha/orders/ {
        limit_req zone=api_limit burst=20 nodelay;
        
        proxy_pass http://zerodha_order/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout settings for order operations
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # Zerodha Portfolio Service
    location /api/zerodha/portfolio/ {
        limit_req zone=api_limit burst=20 nodelay;
        
        proxy_pass http://zerodha_portfolio/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout settings
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # Zerodha Risk Service
    location /api/zerodha/risk/ {
        limit_req zone=api_limit burst=10 nodelay;
        
        proxy_pass http://zerodha_risk/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout settings
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# HTTPS server (for production with SSL certificates)
server {
    listen 443 ssl http2;
    server_name localhost;

    # SSL configuration
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Modern configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Include all the same location blocks as HTTP server
    include /etc/nginx/conf.d/zerodha-locations.conf;
}