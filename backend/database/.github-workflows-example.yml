# Example GitHub Actions workflow for automated database migrations
# Copy this to .github/workflows/database-migrations.yml in your repository

name: Database Migrations

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/database/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/database/**'

env:
  POSTGRES_URL: postgresql://tradeflow:tradeflow_password@localhost:5432/tradeflow

jobs:
  validate-migrations:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: tradeflow
          POSTGRES_USER: tradeflow
          POSTGRES_PASSWORD: tradeflow_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/database/package.json

      - name: Install dependencies
        run: |
          cd backend/database
          npm install

      - name: Validate migration syntax
        run: |
          cd backend/database
          # Check SQL syntax (basic validation)
          for file in migrations/*.sql; do
            echo "Validating $file..."
            # You could add more sophisticated SQL validation here
            grep -q "BEGIN;" "$file" && grep -q "COMMIT;" "$file" || {
              echo "Error: Migration $file missing transaction blocks"
              exit 1
            }
          done

      - name: Run migrations (dry run)
        run: |
          cd backend/database
          ./migrate.sh status
          ./migrate.sh migrate

      - name: Verify migration status
        run: |
          cd backend/database
          ./migrate.sh status

  deploy-migrations:
    runs-on: ubuntu-latest
    needs: validate-migrations
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging
        env:
          POSTGRES_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          cd backend/database
          npm install --production
          ./migrate.sh migrate

      # Add production deployment step here if needed
      # - name: Deploy to production
      #   env:
      #     POSTGRES_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      #   run: |
      #     cd backend/database
      #     ./migrate.sh migrate